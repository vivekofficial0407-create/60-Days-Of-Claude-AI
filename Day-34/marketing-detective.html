<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
:root{
  --bg-0:#0a0e14;
  --bg-1:#0f151f;
  --cork:#1a2233;
  --cork-2:#141b28;
  --paper:#f3ead9;
  --paper-2:#e9dfc9;
  --ink:#2b2620;
  --accent:#3aa0ff;
  --accent-2:#7fd0ff;
  --accent-glow:rgba(58,160,255,0.55);
  --gold:#e8c07d;
  --danger:#ff6b6b;
  --success:#57e0a0;
  --pin-red:#d84a4a;
  --pin-blue:#3aa0ff;
  --pin-gold:#e8c07d;
  --pin-green:#57e0a0;
  --font-serif: 'Georgia', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-hand: 'Bradley Hand', 'Comic Sans MS', cursive;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at top, #131b28 0%, var(--bg-0) 60%),
    var(--bg-0);
  color:#dfe6ee;
  font-family:var(--font-sans);
  overflow-x:hidden;
}
#app{position:relative; min-height:100vh; width:100%;}
.screen{
  min-height:100vh;
  width:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeOut{ from{opacity:1;} to{opacity:0;} }

/* ---------- Shared widgets ---------- */
.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  background:rgba(58,160,255,0.12);
  border:1px solid rgba(58,160,255,0.4);
  color:var(--accent-2);
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.btn{
  font-family:var(--font-sans);
  font-weight:600;
  font-size:15px;
  padding:12px 26px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.12);
  background:linear-gradient(180deg, #1c2636, #131a26);
  color:#dfe6ee;
  cursor:pointer;
  transition:all 0.25s ease;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px var(--accent-glow);
  border-color:var(--accent);
  color:#fff;
}
.btn:active{ transform:translateY(0px); }
.btn.primary{
  background:linear-gradient(180deg, var(--accent), #1c78d1);
  border:1px solid rgba(255,255,255,0.2);
  color:#04121f;
  font-weight:700;
}
.btn.primary:hover{ box-shadow:0 8px 24px var(--accent-glow); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }

.title-font{ font-family:var(--font-serif); letter-spacing:0.5px; }

/* ---------- Intro / Case Assignment ---------- */
.intro-wrap{
  max-width:760px;
  text-align:center;
  margin-top:6vh;
}
.badge-case{
  display:inline-block;
  padding:14px 20px;
  border:2px solid var(--gold);
  border-radius:6px;
  transform:rotate(-2deg);
  color:var(--gold);
  font-family:var(--font-serif);
  letter-spacing:3px;
  margin-bottom:28px;
  box-shadow:0 0 24px rgba(232,192,125,0.25);
}
.intro-wrap h1{
  font-size:44px;
  margin:0 0 8px;
  font-family:var(--font-serif);
  background:linear-gradient(180deg,#fff,var(--accent-2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 40px var(--accent-glow);
}
.intro-wrap p.sub{ color:#9fb0c3; font-size:16px; margin-bottom:36px; }

.folder{
  position:relative;
  width:min(560px,90vw);
  background:var(--paper);
  color:var(--ink);
  border-radius:4px 4px 10px 10px;
  padding:34px 30px 30px;
  margin:20px auto 32px;
  box-shadow:0 20px 50px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.2);
  text-align:left;
  transform:rotate(-0.6deg);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
}
.folder:before{
  content:"CONFIDENTIAL";
  position:absolute;
  top:14px; right:18px;
  font-family:var(--font-serif);
  font-size:11px;
  letter-spacing:2px;
  color:#a33;
  border:1px solid #a33;
  padding:2px 8px;
  transform:rotate(6deg);
  opacity:0.7;
}
.folder h2{
  font-family:var(--font-serif);
  margin:0 0 4px;
  font-size:24px;
  border-bottom:2px dashed rgba(0,0,0,0.25);
  padding-bottom:10px;
}
.folder .field{ margin:10px 0; font-size:14px; line-height:1.5;}
.folder .field b{ color:#6a4a1e; }
.stamp{
  display:inline-block;
  margin-top:16px;
  border:3px solid #a33;
  color:#a33;
  padding:6px 14px;
  font-family:var(--font-serif);
  font-weight:bold;
  letter-spacing:3px;
  transform:rotate(-8deg);
  opacity:0.85;
  border-radius:4px;
}

/* ---------- Corkboard ---------- */
.corkboard{
  width:100%;
  max-width:1200px;
  border-radius:14px;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,0.03), transparent 40%),
    repeating-radial-gradient(circle at 30% 40%, rgba(0,0,0,0.06) 0, rgba(0,0,0,0.06) 2px, transparent 3px, transparent 6px),
    linear-gradient(160deg, #3a2b1c, #2a1f14 60%, #241a10);
  border:10px solid #1b130c;
  box-shadow:0 30px 70px rgba(0,0,0,0.6), inset 0 0 80px rgba(0,0,0,0.4);
  padding:26px;
  position:relative;
}
.board-header{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  margin-bottom:18px;
}
.board-header h2{ font-family:var(--font-serif); color:var(--gold); margin:0; font-size:22px; text-shadow:0 0 20px rgba(232,192,125,0.35); }

.progress-wrap{
  display:flex; align-items:center; gap:10px; color:#c9b28a; font-size:12px;
}
.progress-bar{
  width:160px; height:8px; border-radius:6px; background:rgba(0,0,0,0.4); overflow:hidden; border:1px solid rgba(255,255,255,0.08);
}
.progress-fill{
  height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width 0.5s ease; box-shadow:0 0 12px var(--accent-glow);
}

.evidence-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
  gap:26px;
  position:relative;
}
.sticky{
  position:relative;
  padding:18px 16px 20px;
  min-height:150px;
  color:var(--ink);
  font-family:var(--font-hand), var(--font-sans);
  font-size:14.5px;
  line-height:1.45;
  cursor:grab;
  box-shadow:0 10px 20px rgba(0,0,0,0.45);
  transition:transform 0.25s ease, box-shadow 0.25s ease;
  user-select:none;
  border-radius:2px;
}
.sticky:hover{ transform:translateY(-6px) scale(1.02) rotate(0deg) !important; box-shadow:0 18px 34px rgba(0,0,0,0.6), 0 0 22px var(--accent-glow); z-index:5;}
.sticky.dragging{ opacity:0.55; cursor:grabbing; }
.sticky h4{
  margin:0 0 8px; font-family:var(--font-serif); font-size:14px; letter-spacing:0.5px; color:#5a4322; text-transform:uppercase;
}
.sticky.color-1{ background:#f6e58d; }
.sticky.color-2{ background:#a3d9c9; }
.sticky.color-3{ background:#f3b6c4; }
.sticky.color-4{ background:#a9c7f0; }
.sticky.color-5{ background:#f0c99e; }
.sticky.color-6{ background:#d8c7f0; }

.pin{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:16px; height:16px; border-radius:50%;
  box-shadow:0 3px 5px rgba(0,0,0,0.5), inset 0 -2px 2px rgba(0,0,0,0.25), inset 0 2px 2px rgba(255,255,255,0.4);
}
.pin.red{ background:radial-gradient(circle at 35% 30%, #ff8a8a, var(--pin-red)); }
.pin.blue{ background:radial-gradient(circle at 35% 30%, #8fd0ff, var(--pin-blue)); }
.pin.gold{ background:radial-gradient(circle at 35% 30%, #ffe9b8, var(--pin-gold)); }
.pin.green{ background:radial-gradient(circle at 35% 30%, #a9ffd6, var(--pin-green)); }

.sticky.examined{ outline:2px solid var(--accent); box-shadow:0 0 0 4px rgba(58,160,255,0.18), 0 18px 34px rgba(0,0,0,0.6); }
.examined-tag{
  position:absolute; bottom:6px; right:8px; font-size:10px; letter-spacing:1px; color:#2e6b45; font-family:var(--font-sans); font-weight:700;
}

.string-svg{ position:absolute; inset:0; pointer-events:none; width:100%; height:100%; }

.detail-panel{
  margin-top:22px;
  background:rgba(10,14,20,0.85);
  border:1px solid rgba(58,160,255,0.3);
  border-radius:12px;
  padding:20px 22px;
  color:#dbe7f5;
  box-shadow:0 0 30px rgba(58,160,255,0.08);
  animation:fadeIn 0.4s ease;
}
.detail-panel h3{ margin:0 0 8px; color:var(--accent-2); font-family:var(--font-serif); }

.board-actions{ margin-top:26px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

/* ---------- Solve screen ---------- */
.solve-wrap{ max-width:820px; width:100%; }
.suspect-list{ display:flex; flex-direction:column; gap:14px; margin-top:20px; }
.suspect-card{
  background:var(--cork-2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  padding:16px 18px;
  cursor:pointer;
  transition:all 0.2s ease;
  position:relative;
}
.suspect-card:hover{ border-color:var(--accent); transform:translateX(6px); box-shadow:0 6px 18px var(--accent-glow); }
.suspect-card.selected{ border-color:var(--accent); background:linear-gradient(90deg, rgba(58,160,255,0.12), transparent); }
.suspect-card.correct{ border-color:var(--success); box-shadow:0 0 22px rgba(87,224,160,0.35); }
.suspect-card.wrong{ border-color:var(--danger); box-shadow:0 0 22px rgba(255,107,107,0.35); }
.suspect-card h4{ margin:0 0 4px; font-family:var(--font-serif); color:#fff; }
.suspect-card p{ margin:0; color:#a9b7c6; font-size:13.5px; }

/* ---------- Case closed ---------- */
.closed-wrap{ text-align:center; margin-top:10vh; position:relative;}
.stamp-big{
  font-family:var(--font-serif);
  font-size:64px;
  font-weight:900;
  color:var(--success);
  border:6px solid var(--success);
  padding:14px 34px;
  border-radius:10px;
  display:inline-block;
  letter-spacing:6px;
  transform:scale(0) rotate(-10deg);
  animation:stampIn 0.55s cubic-bezier(.2,1.4,.4,1) forwards 0.15s;
  box-shadow:0 0 60px rgba(87,224,160,0.4);
}
.stamp-big.fail{ color:var(--danger); border-color:var(--danger); box-shadow:0 0 60px rgba(255,107,107,0.4); }
@keyframes stampIn{ to{ transform:scale(1) rotate(-6deg); } }
.confetti{ position:fixed; top:-20px; width:10px; height:16px; opacity:0.9; animation:fall linear forwards; z-index:50; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0.2; } }

/* ---------- Learning report ---------- */
.report-wrap{ max-width:880px; width:100%; }
.report-card{
  background:var(--paper); color:var(--ink); border-radius:10px; padding:26px 28px;
  margin-bottom:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative;
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
}
.report-card h3{ font-family:var(--font-serif); margin-top:0; border-bottom:2px dashed rgba(0,0,0,0.2); padding-bottom:8px; }
.report-card ul{ margin:8px 0; padding-left:20px; }
.metrics-charts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; margin-top:14px; }
.metric-box{ background:rgba(255,255,255,0.5); border-radius:8px; padding:10px 12px; }
.metric-box .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#6a5a3e; }
.metric-box .bar-bg{ height:10px; background:rgba(0,0,0,0.12); border-radius:6px; overflow:hidden; margin-top:6px;}
.metric-box .bar-fill{ height:100%; background:linear-gradient(90deg,#3aa0ff,#7fd0ff); border-radius:6px; width:0; transition:width 1.2s ease;}
.metric-box .val{ font-family:var(--font-serif); font-size:16px; margin-top:4px; }

.footer-actions{ display:flex; gap:14px; justify-content:center; margin:26px 0 40px; flex-wrap:wrap; }

/* animated typewriter cursor */
.type-cursor::after{ content:'|'; animation:blink 1s step-start infinite; }
@keyframes blink{ 50%{ opacity:0; } }

@media (max-width:640px){
  .intro-wrap h1{ font-size:30px; }
  .folder{ padding:22px 18px 20px; }
  .evidence-grid{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:18px; }
  .progress-bar{ width:100px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================= CASE DATA ============================= */
const CASES = [
{
  company:"Bloom & Bean Coffee Co.",
  industry:"Food & Beverage (Specialty Coffee)",
  objective:"Drive foot traffic to 12 new urban café locations within Q1.",
  audience:"Young professionals aged 24-35 in metro downtown areas, health-conscious and price-sensitive.",
  channels:["Instagram Ads","Local Radio","Influencer Seeding","In-store Flyers"],
  budget:[["Instagram Ads",40],["Local Radio",30],["Influencer Seeding",20],["In-store Flyers",10]],
  metrics:{reach:"1.8M", ctr:"0.4%", engagement:"2.1%", conversions:"3,200", sales:"$41,000"},
  comments:[
    "\"Saw the ad but the store nowhere near where I live.\"",
    "\"Cool video, wrong city though — I'm in Denver not Austin.\"",
    "\"Ad kept showing me the same promo for a location 40 miles away.\""
  ],
  social:"High impressions, very low click-through; comments dominated by location confusion; engagement mostly emoji reactions, few saves or shares.",
  mistake:"The Instagram ad campaign used a single broad geographic radius setting instead of geofencing each individual café location, so budget was wasted showing ads to people far outside walking/driving distance of any store.",
  clues:[
    "Budget dashboard shows one combined 'National Metro' targeting group instead of 12 separate location-based ad sets.",
    "Customer comments repeatedly mention distance and wrong-city confusion.",
    "CTR is unusually low (0.4%) despite high reach, suggesting irrelevant targeting rather than weak creative."
  ],
  explanation:"The team ran a single, broadly-targeted ad set across an entire metro radius rather than creating geofenced, location-specific campaigns for each of the 12 café openings. This diluted relevance, wasted impressions on people who could never visit, and depressed CTR and conversions even though reach looked impressive on paper.",
  improvements:[
    "Split the campaign into 12 geofenced ad sets, each targeting a small radius around its specific café.",
    "Use dynamic location insertion in ad copy so each viewer sees their nearest store's name and hours.",
    "Reallocate wasted radio spend toward hyperlocal social ads with proximity-based bidding."
  ]
},
{
  company:"Vertex Fitness Gear",
  industry:"Athletic Apparel & Equipment",
  objective:"Launch a new line of resistance bands and hit 10,000 units sold in 60 days.",
  audience:"Home-workout enthusiasts, 22-45, moderate to high income, active on fitness social media.",
  channels:["TikTok Ads","Email Newsletter","Affiliate Fitness Influencers","Google Shopping"],
  budget:[["TikTok Ads",45],["Affiliate Influencers",25],["Google Shopping",20],["Email",10]],
  metrics:{reach:"3.4M", ctr:"3.8%", engagement:"9.5%", conversions:"1,150", sales:"$58,000"},
  comments:[
    "\"Added to cart but the checkout page kept erroring out on my phone.\"",
    "\"Tried three times to buy on mobile, gave up.\"",
    "\"Loved the video! Couldn't complete my order though, so annoying.\""
  ],
  social:"Extremely high engagement and shares on TikTok; strong CTR; but conversions far below what CTR would predict, with many complaints specifically about checkout on mobile devices.",
  mistake:"The checkout flow was not optimized for mobile devices, causing a broken or extremely slow payment form that dropped the majority of TikTok-driven mobile traffic before purchase completion.",
  clues:[
    "CTR (3.8%) and engagement (9.5%) are excellent, meaning the creative and targeting worked well.",
    "Conversion rate is dramatically lower than CTR would suggest for a campaign this engaging.",
    "Multiple comments specifically cite mobile checkout errors, and TikTok traffic is overwhelmingly mobile."
  ],
  explanation:"The marketing itself was highly effective at capturing attention and driving clicks, especially on TikTok, which is an almost entirely mobile platform. However, the mobile checkout experience had unresolved technical friction (likely a broken payment form or slow load time), causing a steep drop-off between click and purchase that no amount of ad spend could fix.",
  improvements:[
    "Conduct mobile checkout QA testing across major devices and browsers before scaling ad spend.",
    "Add one-tap payment options (Apple Pay/Google Pay) to reduce checkout friction.",
    "Monitor funnel drop-off rates in real time and pause spend if conversion rate falls below a set threshold."
  ]
},
{
  company:"Lumen & Loom Home Décor",
  industry:"Home Goods & Furniture",
  objective:"Increase average order value (AOV) through a curated 'Room Bundles' campaign.",
  audience:"Homeowners aged 30-55 furnishing or renovating, middle-to-upper income.",
  channels:["Pinterest Ads","Retargeting Display","Email Segmentation","YouTube Pre-roll"],
  budget:[["Pinterest Ads",35],["Retargeting",30],["Email",20],["YouTube",15]],
  metrics:{reach:"920K", ctr:"1.6%", engagement:"4.2%", conversions:"680", sales:"$132,000"},
  comments:[
    "\"The bundle looked nothing like what actually shipped — different rug color entirely.\"",
    "\"Photos on the site don't match what I received, disappointed.\"",
    "\"Beautiful styling in the ad, but real product colors are duller.\""
  ],
  social:"Strong initial engagement and saves on Pinterest; return/complaint rate on social comments unusually high referencing color and product mismatch, not price or shipping.",
  mistake:"The campaign used heavily color-corrected and styled lifestyle photography that did not accurately represent the true colors and materials of the bundled products, leading to a spike in returns and negative sentiment despite decent sales figures.",
  clues:[
    "Sales figure looks healthy ($132,000) but customer comments focus overwhelmingly on visual mismatch, not price.",
    "Complaints specifically mention color and material differences between ads and delivered product.",
    "Engagement and saves were high pre-purchase, suggesting the imagery itself was the draw — and the liability."
  ],
  explanation:"The marketing visuals were over-styled and color-graded to look aspirational, which drove strong engagement and initial purchases, but created a mismatch between expectation and reality once products arrived. This is a classic case of creative appeal outrunning product accuracy, which drives short-term sales but long-term returns, refunds, and trust erosion.",
  improvements:[
    "Pair styled lifestyle photography with true-to-life, unedited product shots in the same gallery.",
    "Add a color-accuracy disclaimer and a 'true color' zoom feature on product pages.",
    "Track return reasons and feed them back into creative review before scaling similar campaigns."
  ]
},
{
  company:"NovaByte Electronics",
  industry:"Consumer Tech",
  objective:"Generate pre-orders for a new smart home hub ahead of holiday season.",
  audience:"Tech-savvy early adopters aged 25-45.",
  channels:["Google Search Ads","Reddit Ads","Tech YouTuber Sponsorships","Press Release"],
  budget:[["YouTuber Sponsorships",50],["Google Search",25],["Reddit",15],["Press Release",10]],
  metrics:{reach:"2.1M", ctr:"2.9%", engagement:"6.7%", conversions:"410", sales:"$61,500"},
  comments:[
    "\"The YouTuber said it works with all smart bulbs but mine isn't even listed as compatible.\"",
    "\"Ordered based on the review, now finding out my thermostat isn't supported.\"",
    "\"Felt misled — sponsor read felt like it applied to way more devices than it does.\""
  ],
  social:"High view counts on sponsored videos; comment sections increasingly filled with compatibility complaints; sentiment shifted negative mid-campaign.",
  mistake:"Sponsored influencer scripts overstated the product's device compatibility without the marketing team verifying claims against the actual supported-device list, creating a mismatch between promised and real functionality.",
  clues:[
    "Multiple sponsorship videos use similar broad compatibility language not found in the official spec sheet.",
    "Comment sentiment shifts negative partway through the campaign timeline, right as early buyers received their units.",
    "Conversions are moderate but sales dollar figure is being undercut by an increasing volume of complaint threads and refund requests referenced in social listening."
  ],
  explanation:"The team handed influencers a talking-points script emphasizing broad 'smart home compatibility' without cross-checking it against the actual certified device list. Influencers repeated the overstated claims verbatim, and once early buyers discovered the gap between promise and reality, sentiment and trust collapsed mid-campaign.",
  improvements:[
    "Require legal/product review of all influencer scripts against verified spec sheets before publishing.",
    "Provide a clear, searchable compatibility checker on the pre-order landing page.",
    "Set up real-time social listening alerts to catch compatibility complaints early and issue corrective statements."
  ]
},
{
  company:"Verdant Skincare Lab",
  industry:"Beauty & Personal Care",
  objective:"Build brand awareness for a new 'clean beauty' serum line among Gen Z.",
  audience:"Gen Z consumers aged 16-24 interested in sustainable, cruelty-free beauty.",
  channels:["TikTok Organic + Ads","Instagram Reels","Micro-influencers","Referral Program"],
  budget:[["TikTok Ads",40],["Micro-influencers",35],["Instagram Reels",15],["Referral Program",10]],
  metrics:{reach:"5.6M", ctr:"4.5%", engagement:"11.2%", conversions:"2,900", sales:"$87,000"},
  comments:[
    "\"Love the brand but just found out it's not actually vegan, kind of feels like greenwashing.\"",
    "\"The 'clean beauty' claim doesn't match the ingredient list I looked up.\"",
    "\"Called out on TikTok for using a synthetic preservative while claiming 'all-natural' — awkward.\""
  ],
  social:"Viral reach and huge engagement initially; a backlash duet/stitch trend emerged fact-checking ingredient claims, causing engagement to spike again but with negative sentiment and #greenwashing mentions.",
  mistake:"Marketing copy and influencer messaging used unverified 'clean' and 'all-natural' claims that did not match the actual ingredient list, triggering a public fact-checking backlash once savvy Gen Z consumers scrutinized the label.",
  clues:[
    "Engagement remains extremely high even after sentiment turns negative, showing the backlash itself is fueling reach.",
    "Comments specifically cite ingredient-list discrepancies, not price or product performance.",
    "Target audience (Gen Z, sustainability-focused) is exactly the demographic most likely to fact-check clean-beauty claims publicly."
  ],
  explanation:"The brand's positioning leaned on unverified 'clean' and 'all-natural' language that didn't hold up against the actual formulation. Because the target audience is highly literate in ingredient transparency and quick to call out greenwashing, the claims were publicly fact-checked and turned into a viral credibility crisis rather than a viral growth moment.",
  improvements:[
    "Only use regulated or verifiable claims ('vegan-certified', 'EWG-verified') backed by documentation.",
    "Conduct an ingredient transparency audit before any 'clean beauty' messaging goes live.",
    "Get ahead of scrutiny by publishing a transparent, plain-language ingredient breakdown on the product page."
  ]
},
{
  company:"Trailhead Outdoor Co.",
  industry:"Outdoor Recreation & Apparel",
  objective:"Boost sales of winter gear during an unusually warm regional winter.",
  audience:"Outdoor enthusiasts aged 25-50 in northern and mountain regions.",
  channels:["Facebook Ads","Local TV Spots","Email Blasts","Print Catalog"],
  budget:[["Facebook Ads",30],["Local TV",35],["Email",20],["Print Catalog",15]],

/* ============================= UTILITIES ============================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if(children) (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

const state = {

const root = document.getElementById('app');

/* build the pool of evidence cards for a case: primary mistake clue-ish items + 3 supporting clues + comments + social + metrics summary */
function buildEvidenceCards(c){
  const cards = [];
  cards.push({title:"Campaign Overview", color:1, pin:'gold', text:`${c.company} — ${c.industry}\n\nObjective: ${c.objective}\n\nAudience: ${c.audience}`});
  cards.push({title:"Channel & Budget Split", color:2, pin:'blue', text: c.budget.map(b=>`${b[0]}: ${b[1]}%`).join('\n') + `\n\nChannels used:\n${c.channels.join(', ')}`});
  cards.push({title:"Campaign Metrics", color:3, pin:'green', text:`Reach: ${c.metrics.reach}\nCTR: ${c.metrics.ctr}\nEngagement: ${c.metrics.engagement}\nConversions: ${c.metrics.conversions}\nSales: ${c.metrics.sales}`});
  cards.push({title:"Customer Comments", color:4, pin:'red', text: c.comments.join('\n\n')});
  cards.push({title:"Social Media Performance", color:5, pin:'blue', text: c.social});
  cards.push({title:"Field Notes (Clues)", color:6, pin:'gold', text: c.clues.map((cl,i)=>`Clue ${i+1}: ${cl}`).join('\n\n')});
  return cards;
}

function buildSuspects(caseData){
  // wrong options = mistakes borrowed from other cases (shortened), correct = actual mistake
  const others = CASES.filter(c=>c!==caseData);
  const wrongPool = shuffle(others).slice(0,3).map(c=>c.mistake);
  const options = shuffle([caseData.mistake, ...wrongPool]);
  return options;
}

/* ============================= RENDER: BOARD ============================= */
let evidenceCards = [];
let dragSrcIndex = null;

function renderBoard(){
  clear(root);
  const c = state.caseData;
  evidenceCards = buildEvidenceCards(c);
  state.totalEvidence = evidenceCards.length;

  const wrap = el('div',{class:'screen'});
  const board = el('div',{class:'corkboard'});

  const header = el('div',{class:'board-header'});
  header.appendChild(el('h2',{}, '🔎 Investigation Board — ' + c.company));
  const progWrap = el('div',{class:'progress-wrap'});
  const pbar = el('div',{class:'progress-bar'});
  const pfill = el('div',{class:'progress-fill', id:'progFill'});
  pbar.appendChild(pfill);
  progWrap.appendChild(el('span',{}, 'Evidence examined'));
  progWrap.appendChild(pbar);
  progWrap.appendChild(el('span',{id:'progText'}, '0/' + state.totalEvidence));
  header.appendChild(progWrap);
  board.appendChild(header);

  const grid = el('div',{class:'evidence-grid', id:'evidenceGrid'});
  evidenceCards.forEach((card, idx)=>{
    const rot = (idx % 2 === 0 ? -3 : 2) + (Math.random()*2-1);
    const sticky = el('div',{
      class:'sticky color-'+card.color,
      style:`transform:rotate(${rot.toFixed(1)}deg);`,
      draggable:'true',
      'data-idx': idx
    });
    sticky.appendChild(el('div',{class:'pin '+card.pin}));
    sticky.appendChild(el('h4',{}, card.title));
    sticky.appendChild(el('div',{}, '📌 Click to examine…'));
    sticky.addEventListener('click', ()=> examineEvidence(idx));
    sticky.addEventListener('dragstart', (e)=>{ dragSrcIndex = idx; sticky.classList.add('dragging'); });
    sticky.addEventListener('dragend', ()=>{ sticky.classList.remove('dragging'); });
    sticky.addEventListener('dragover', (e)=> e.preventDefault());
    sticky.addEventListener('drop', (e)=>{
      e.preventDefault();
      if(dragSrcIndex===null || dragSrcIndex===idx) return;
      const parent = grid;
      const nodes = Array.from(parent.children).filter(n=>n.classList.contains('sticky'));
      const srcNode = nodes[dragSrcIndex];
      parent.insertBefore(srcNode, sticky);
    });
    grid.appendChild(sticky);
  });
  board.appendChild(grid);

  const detail = el('div',{id:'detailPanel'});
  board.appendChild(detail);

  const actions = el('div',{class:'board-actions'});
  const solveBtn = el('button',{class:'btn primary', id:'solveBtn', disabled:'disabled', onclick:()=>{ state.screen='solve'; renderSolve(); }}, 'Solve the Case 🕵️');
  actions.appendChild(solveBtn);
  board.appendChild(actions);

  wrap.appendChild(board);
  root.appendChild(wrap);
  updateProgress();
}

function examineEvidence(idx){
  state.examinedEvidence.add(idx);
  const grid = document.getElementById('evidenceGrid');
  const stickies = grid.querySelectorAll('.sticky');
  stickies.forEach(s=>{
    if(parseInt(s.getAttribute('data-idx'),10)===idx){
      s.classList.add('examined');
      if(!s.querySelector('.examined-tag')){
        s.appendChild(el('div',{class:'examined-tag'},'✓ EXAMINED'));
      }
    }
  });
  const card = evidenceCards[idx];
  const panel = document.getElementById('detailPanel');
  clear(panel);
  panel.className = 'detail-panel';
  panel.appendChild(el('h3',{}, '📄 ' + card.title));
  const pre = el('div',{style:'white-space:pre-wrap; font-size:14px; line-height:1.6; color:#c9d8e8;'}, card.text);
  panel.appendChild(pre);
  updateProgress();
}

function updateProgress(){
  const n = state.examinedEvidence.size;
  const total = state.totalEvidence;
  const pfill = document.getElementById('progFill');
  const ptext = document.getElementById('progText');
  if(pfill) pfill.style.width = Math.round((n/total)*100) + '%';
  if(ptext) ptext.textContent = n + '/' + total;
  const solveBtn = document.getElementById('solveBtn');
  if(solveBtn){
    if(n >= 3){ solveBtn.removeAttribute('disabled'); }
    else { solveBtn.setAttribute('disabled','disabled'); }
  }
}

/* ============================= RENDER: SOLVE ============================= */
function renderSolve(){
  clear(root);
  const c = state.caseData;
  state.solveOptions = buildSuspects(c);

  const wrap = el('div',{class:'screen'});
  const inner = el('div',{class:'solve-wrap'});
  inner.appendChild(el('div',{class:'badge'}, 'FINAL DEDUCTION'));
  inner.appendChild(el('h2',{class:'title-font', style:'margin-top:14px;'}, 'What was the real marketing mistake?'));
  inner.appendChild(el('p',{style:'color:#9fb0c3;'}, 'Review your evidence, then choose the explanation that best fits the clues.'));

  const list = el('div',{class:'suspect-list', id:'suspectList'});
  state.solveOptions.forEach((opt, i)=>{
    const card = el('div',{class:'suspect-card', 'data-i':i});
    card.appendChild(el('h4',{}, 'Theory ' + (i+1)));
    card.appendChild(el('p',{}, opt));
    card.addEventListener('click', ()=>{
      if(state.solved) return;
      Array.from(list.children).forEach(ch=>ch.classList.remove('selected'));
      card.classList.add('selected');
      state.chosenMistake = opt;
      confirmBtn.removeAttribute('disabled');
    });
    list.appendChild(card);
  });
  inner.appendChild(list);

  const confirmBtn = el('button',{class:'btn primary', style:'margin-top:22px;', disabled:'disabled', onclick:()=> submitSolution(list)}, 'Lock In Theory 🔒');
  inner.appendChild(confirmBtn);
  wrap.appendChild(inner);
  root.appendChild(wrap);
}

function submitSolution(list){
  state.solved = true;
  const c = state.caseData;
  const correct = state.chosenMistake === c.mistake;
  Array.from(list.children).forEach(card=>{
    const i = parseInt(card.getAttribute('data-i'),10);
    const opt = state.solveOptions[i];
    if(opt === c.mistake) card.classList.add('correct');
    else if(card.classList.contains('selected')) card.classList.add('wrong');
  });
  state.wasCorrect = correct;
  setTimeout(()=>{ state.screen='closed'; renderClosed(); }, 1400);
}

  clear(root);
  const wrap = el('div',{class:'screen'});

  inner.appendChild(btn);
  wrap.appendChild(inner);
  root.appendChild(wrap);

  if(state.wasCorrect){
    spawnConfetti();
  }
}

function spawnConfetti(){
  const colors = ['#3aa0ff','#7fd0ff','#e8c07d','#57e0a0','#ff6b6b'];
  for(let i=0;i<60;i++){
    const p = el('div',{class:'confetti'});
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.2 + Math.random()*2.2) + 's';
    p.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(p);
    setTimeout(()=>{ p.remove(); }, 5500);
  }
}

  state.caseData = CASES[Math.floor(Math.random()*CASES.length)];
  state.examinedEvidence = new Set();
  state.chosenMistake = null;
  state.solved = false;
  state.wasCorrect = false;
  state.screen = 'intro';
  renderIntro();
}

startNewCase();
})();
</script>
